name: Publish report to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "report/**"
      - "docs/figures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render report and slides
        working-directory: report
        run: |
          quarto render manuscript.qmd
          quarto render slides.qmd

      - name: Assemble Pages site
        run: |
          set -e
          rm -rf site
          mkdir -p site/report site/docs
          cp report/manuscript.html site/report/
          cp report/slides.html site/report/
          cp report/slides.css site/report/
          [ -d report/manuscript_files ] && cp -r report/manuscript_files site/report/ || true
          [ -d report/slides_files ] && cp -r report/slides_files site/report/ || true
          cp -r docs/figures site/docs/figures
          cp report/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
