# Conda environment for users not using pixi.
#   conda env create -f environment.yml && conda activate thunderquakes
#   pip install -e .
# Preferred workflow is pixi (see pixi.toml); this is the fallback.
name: thunderquakes
channels:
  - conda-forge
  - pytorch
dependencies:
  - python>=3.11,<3.13
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - h5py
  - obspy>=1.4
  - scikit-learn
  - xarray
  - netcdf4
  - requests
  - tqdm
  - pyyaml
  - jupyterlab
  - pytorch>=2.1
  - torchvision
  - quarto
  - pip
  - pip:
      - s3fs
      - -e .
